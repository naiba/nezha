<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线统计 | Nezha Monitoring</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e9ef;
    --muted: #8b93a5; --accent: #4a9eff; --green: #34d399; --red: #f87171; --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; }
  .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  button, select, input { background: #1f242e; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
    background: var(--red); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  /* 每日时间轴：一行一天，绿色段为在线区间 */
  .day-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .day-label { width: 84px; color: var(--muted); font-size: 12px; flex: none; }
  .day-track { flex: 1; height: 18px; background: #10131a; border: 1px solid var(--border);
    border-radius: 5px; position: relative; overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; background: var(--green); opacity: .85; }
  .seg.ongoing { background: var(--amber); }
  .day-seconds { width: 92px; text-align: right; color: var(--muted); font-size: 12px; flex: none; }
  .error { color: var(--red); }
  .ok { color: var(--green); }
  .hidden { display: none; }
  code { background: #10131a; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>设备在线统计</h1>
  <div class="sub">Nezha Monitoring · 在线时间段统计（默认 7 天，后台可设 7~3650 天） · <a href="/dashboard/">管理后台</a></div>

  <!-- 登录 -->
  <div id="loginPanel" class="panel hidden">
    <div class="flex">
      <b>请先登录</b>
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="primary" onclick="login()">登录</button>
      <span id="loginMsg" class="error"></span>
    </div>
  </div>

  <!-- 快速在线状态总览 -->
  <div id="listPanel" class="panel hidden">
    <div class="flex" style="margin-bottom:8px">
      <b>设备在线状态</b><span class="muted">每 10 秒自动刷新</span>
      <div class="spacer"></div>
      <button onclick="refreshList()">刷新</button>
    </div>
    <table>
      <thead><tr><th>状态</th><th>设备</th><th>最后活跃</th><th>备注</th><th>操作</th></tr></thead>
      <tbody id="serverRows"></tbody>
    </table>
  </div>

  <!-- 单设备统计 -->
  <div id="statPanel" class="panel hidden">
    <div class="flex">
      <b id="statTitle">统计</b>
      <div class="spacer"></div>
      <label class="muted">查询范围</label>
      <select id="daysSelect" onchange="loadStats()"></select>
      <button onclick="closeStats()">关闭</button>
    </div>
    <div id="statCards" class="cards" style="margin-top:12px"></div>
    <div id="timeline" class="hidden"></div>
    <div id="periodsBox" class="hidden">
      <table>
        <thead><tr><th>#</th><th>开始时间</th><th>结束时间</th><th>时长</th><th>状态</th></tr></thead>
        <tbody id="periodRows"></tbody>
      </table>
    </div>
  </div>

  <!-- 管理设置 -->
  <div id="adminPanel" class="panel hidden">
    <b>统计范围设置（管理员）</b>
    <div class="flex" style="margin-top:8px">
      <span class="muted">统计/保留范围（天，7~3650）</span>
      <input id="statDays" type="number" min="7" max="3650" style="width:100px">
      <button class="primary" onclick="saveSetting()">保存</button>
      <span id="settingMsg"></span>
    </div>
    <div class="muted" style="margin-top:6px">修改后立即生效：新窗口的查询与历史数据保留均按该值执行；也可通过 <code>PATCH /api/v1/setting</code> 的 <code>online_stats_days</code> 字段设置。</div>
  </div>
</div>

<script>
let currentServer = null;
let tokenReady = false;

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  let body = null;
  try { body = await res.json(); } catch (e) { /* non-json */ }
  return { ok: res.ok, status: res.status, body };
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const r = await api('/api/v1/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  const msg = document.getElementById('loginMsg');
  if (r.ok && r.body && r.body.success) {
    msg.textContent = ''; tokenReady = true; boot();
  } else {
    msg.textContent = '登录失败：' + ((r.body && r.body.error) || r.status);
  }
}

async function boot() {
  const setting = await api('/api/v1/setting');
  const daysSelect = document.getElementById('daysSelect');
  let maxDays = 7, isAdmin = false;
  if (setting.ok && setting.body && setting.body.success) {
    const conf = setting.body.data.config || {};
    if (conf.online_stats_days > 0) { maxDays = conf.online_stats_days; }
    isAdmin = conf.site_name !== undefined && conf.enable_mcp !== undefined;
    if (conf.online_stats_days > 0) {
      document.getElementById('statDays').value = conf.online_stats_days;
      if (isAdmin) document.getElementById('adminPanel').classList.remove('hidden');
    }
  }
  const preset = [1, 7, 14, 30, 90, 365].filter(d => d <= maxDays);
  if (!preset.includes(maxDays)) preset.push(maxDays);
  daysSelect.innerHTML = preset.map(d => `<option value="${d}" ${d === 7 ? 'selected' : ''}>最近 ${d} 天</option>`).join('');

  document.getElementById('loginPanel').classList.toggle('hidden', setting.ok);
  if (!setting.ok) return;
  document.getElementById('listPanel').classList.remove('hidden');
  await refreshList();
  setInterval(refreshList, 10000);
}

async function refreshList() {
  const r = await api('/api/v1/server');
  if (r.status === 401 || (r.body && r.body.error === 'unauthorized')) {
    document.getElementById('loginPanel').classList.remove('hidden');
    return;
  }
  if (!r.ok || !r.body.success) return;
  const now = Date.now();
  const rows = (r.body.data || []).map(s => {
    const online = s.last_active && (now - new Date(s.last_active).getTime()) <= 30000;
    return { s, online };
  }).sort((a, b) => (b.online - a.online) || a.s.name.localeCompare(b.s.name));
  document.getElementById('serverRows').innerHTML = rows.map(({ s, online }) => `
    <tr>
      <td><span class="dot ${online ? 'on' : ''}"></span>${online ? '在线' : '离线'}</td>
      <td>${escapeHtml(s.name)}</td>
      <td class="muted">${s.last_active ? new Date(s.last_active).toLocaleString() : '—'}</td>
      <td class="muted">${(s.host && (s.host.platform + ' ' + (s.host.platform_version || ''))).trim() || ''}</td>
      <td><a href="javascript:void(0)" onclick="showStats(${s.id}, '${escapeHtml(s.name)}')">在线统计</a></td>
    </tr>`).join('');
}

async function showStats(id, name) {
  currentServer = id;
  document.getElementById('statPanel').classList.remove('hidden');
  document.getElementById('statTitle').textContent = '「' + name + '」在线统计';
  await loadStats();
  document.getElementById('statPanel').scrollIntoView({ behavior: 'smooth' });
}

function closeStats() {
  currentServer = null;
  document.getElementById('statPanel').classList.add('hidden');
}

async function loadStats() {
  if (!currentServer) return;
  const days = document.getElementById('daysSelect').value;
  const r = await api(`/api/v1/server/${currentServer}/online-history?days=${days}`);
  const box = document.getElementById('statCards');
  const tl = document.getElementById('timeline');
  const pb = document.getElementById('periodsBox');
  if (!r.ok || !r.body.success) {
    box.innerHTML = `<div class="error">加载失败：${(r.body && r.body.error) || r.status}</div>`;
    tl.classList.add('hidden'); pb.classList.add('hidden');
    return;
  }
  const d = r.body.data;
  const winSec = (new Date(d.window_end) - new Date(d.window_start)) / 1000;
  box.innerHTML = `
    <div class="card"><div class="label">当前状态</div>
      <div class="value ${d.currently_online ? 'ok' : 'error'}">${d.currently_online ? '在线' : '离线'}</div></div>
    <div class="card"><div class="label">窗口内在线时长</div>
      <div class="value">${fmtDuration(d.total_online_seconds)}</div></div>
    <div class="card"><div class="label">在线率（窗口 ${d.days} 天）</div>
      <div class="value">${d.online_rate.toFixed(2)}%</div></div>
    <div class="card"><div class="label">统计窗口</div>
      <div class="value" style="font-size:13px;margin-top:6px">${new Date(d.window_start).toLocaleString()}<br>~ ${new Date(d.window_end).toLocaleString()}</div></div>`;

  // 时间轴：以窗口起点为 0%，按天渲染；跨天分段先按自然日切片再定位
  const t0 = new Date(d.window_start).getTime();
  const total = winSec * 1000;
  const pct = ts => ((new Date(ts).getTime() - t0) / total * 100).toFixed(3);
  let dailyMap = {};
  (d.daily || []).forEach(x => dailyMap[x.date] = x.online_seconds);
  const daySlices = (d.daily || []).map((x, i) => {
    const ds = Math.max(t0, new Date(x.date + 'T00:00:00').getTime());
    const de = Math.min(t0 + total, new Date(x.date + 'T00:00:00').getTime() + 86400000);
    return { date: x.date, ds, de };
  });
  tl.innerHTML = daySlices.map(({ date, ds, de }) => {
    const segs = (d.periods || []).map(p => {
      const ps = new Date(p.start).getTime();
      const pe = p.ongoing ? d.window_end : new Date(p.end).getTime();
      const s = Math.max(ps, ds), e = Math.min(pe, de);
      if (s >= e) return '';
      const cls = p.ongoing && pe > de ? 'seg ongoing' : 'seg';
      return `<div class="${cls}" style="left:${pct(new Date(s))}%;width:${Math.max(0.15, (e - s) / total * 100)}%" title="${new Date(ps).toLocaleString()} ~ ${p.ongoing ? '进行中' : new Date(pe).toLocaleString()}"></div>`;
    }).join('');
    return `
    <div class="day-row">
      <div class="day-label">${date}</div>
      <div class="day-track">${segs}</div>
      <div class="day-seconds">${fmtDuration(dailyMap[date] || 0)}</div>
    </div>`;
  }).join('');
  tl.classList.remove('hidden');

  const periods = (d.periods || []).slice().reverse();
  document.getElementById('periodRows').innerHTML = periods.map((p, i) => `
    <tr><td>${periods.length - i}</td><td>${new Date(p.start).toLocaleString()}</td>
    <td>${p.ongoing ? '—' : new Date(p.end).toLocaleString()}</td>
    <td>${fmtDuration(Math.floor((new Date(p.ongoing ? Date.now() : new Date(p.end)) - new Date(p.start)) / 1000))}</td>
    <td>${p.ongoing ? '<span class="ok">进行中</span>' : '已结束'}</td></tr>`).join('');
  pb.classList.remove('hidden');
}

async function saveSetting() {
  const v = parseInt(document.getElementById('statDays').value, 10);
  const msg = document.getElementById('settingMsg');
  const r = await api('/api/v1/setting', { method: 'PATCH', body: JSON.stringify({ online_stats_days: v }) });
  if (r.ok && r.body && r.body.success) {
    msg.className = 'ok'; msg.textContent = '已保存';
    boot();
  } else {
    msg.className = 'error';
    msg.textContent = '保存失败：' + ((r.body && r.body.error) || r.status);
  }
  setTimeout(() => msg.textContent = '', 4000);
}

function fmtDuration(sec) {
  sec = Number(sec) || 0;
  if (sec < 60) return sec + ' 秒';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d > 0) return `${d} 天 ${h} 小时 ${m} 分`;
  if (h > 0) return `${h} 小时 ${m} 分`;
  return m + ' 分';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

boot();
</script>
</body>
</html>
